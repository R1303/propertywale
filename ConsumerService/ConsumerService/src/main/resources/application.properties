spring.application.name=ConsumerService
server.port = 6666

user.service.topic=userServiceTopic
property.service.topic=propertyTopic

eureka.client.serviceUrl.defaultZone  = http://localhost:9091/eureka/
eureka.client.instance.preferIpAddress = true

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=firstGroup
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*



spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.datasource.url=jdbc:mysql://localhost:3306/property_wale
spring.datasource.username=root
spring.datasource.password=rajan
spring.datasource.initialization-mode=always
spring.jpa.properties.hibernate.dialect: org.hibernate.dialect.MySQLDialect